version: "3.9"
services:
  redis:
    image: redis:7.2-alpine
    container_name: backendfoundry-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:16-alpine
    container_name: backendfoundry-postgres
    environment:
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry_local_dev_only
      POSTGRES_DB: backendfoundry_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundry -d backendfoundry_test"]
      interval: 5s
      timeout: 3s
      retries: 5

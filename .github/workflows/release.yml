name: Release Packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish --dry-run"
        required: true
        default: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: "https://registry.npmjs.org"
      - name: Build and Test
        run: |
          node scripts/build-packages.mjs
          node scripts/lint-check.mjs
          node scripts/run-tests.mjs
      - name: Publish (Dry Run by default)
        run: |
          for pkg in core validation errors rate-limit retry circuit-breaker cache idempotency webhooks health logger ai cli; do
            echo "Packing packages/$pkg..."
            npm pack ./packages/$pkg --dry-run
          done
